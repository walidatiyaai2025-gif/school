name: School PDF 1.1.4 Signed cPanel Setup and Update
on:
  pull_request:
    branches: [main]
    paths:
      - 'VERSION'
      - 'backend/**'
      - 'setup/**'
      - '.github/workflows/cpanel-update-release.yml'
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'backend/**'
      - 'setup/**'
      - '.github/workflows/cpanel-update-release.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read

jobs:
  build-exact-candidates:
    # 1.1.4-only release gate; never evaluate 1.1.5 source as a 1.1.4 artifact.
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'feat/1.1.5-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: isolated-ci-root-only
          MARIADB_DATABASE: schoolpdf_ci
          MARIADB_USER: schoolpdf_ci
          MARIADB_PASSWORD: isolated-ci-user-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      mariadb_restore:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: isolated-ci-root-only
          MARIADB_DATABASE: schoolpdf_restore_ci
          MARIADB_USER: schoolpdf_ci
          MARIADB_PASSWORD: isolated-ci-user-password
        ports: ['3307:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      SCHOOLPDF_TEST_DB_USERNAME: schoolpdf_ci
      SCHOOLPDF_TEST_DB_PASSWORD: isolated-ci-user-password
      SCHOOLPDF_TEST_DB_DATABASE: schoolpdf_ci
      SCHOOLPDF_TEST_RESTORE_DATABASE: schoolpdf_restore_ci
      SCHOOLPDF_TEST_RESTORE_PORT: '3307'
      SCHOOLPDF_RELEASE_ED25519_KEY_B64: ${{ github.ref == 'refs/heads/main' && secrets.SCHOOLPDF_RELEASE_ED25519_KEY_B64 || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SchoolPDF-Setup-v1.1.3-VERIFIED
          run-id: 44686475320
          github-token: ${{ github.token }}
          path: previous
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: pdo_mysql, pdo_sqlite, zip, fileinfo, openssl, sodium, mbstring
          coverage: none
      - name: Inspect immutable previously verified 1.1.3 Setup and production dependencies
        run: |
          cd previous
          sha256sum -c SchoolPDF-Setup-v1.1.3.sha256
          cd ..
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,re,zipfile
          previous=pathlib.Path('previous/SchoolPDF-Setup-v1.1.3.zip')
          with zipfile.ZipFile(previous) as z:
              assert z.testzip() is None
              j=json.loads(z.read('SETUP_MANIFEST.json'))
              assert j['kind']=='fresh-install' and j['version']=='1.1.3'
              assert j['git_sha']=='b8c93ce4f967da23efd723c984fb2c069ad992a1'
              assert j['signed_updates'] is True
              prior_lock=hashlib.sha256(z.read('composer.lock')).hexdigest()
              match=re.search(r'SCHOOLPDF_ED25519_UPDATE_PUBLIC_KEY="([^"]+)"',z.read('.env.example').decode())
              assert match, 'prior release public trust anchor missing'
              assert len(base64.b64decode(match.group(1),validate=True))==32
          current=hashlib.sha256(pathlib.Path('backend/composer.lock').read_bytes()).hexdigest()
          assert current==prior_lock, 'Composer dependency change requires a separately verified supported upgrade'
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('SCHOOLPDF_BASE_LOCK_SHA='+prior_lock+'\n')
              f.write('SCHOOLPDF_BASE_PUBLIC_B64='+match.group(1)+'\n')
          print('Prior verified 1.1.3 Setup, committed source SHA, unchanged dependencies and public trust verified.')
          PY
      - name: Use disposable signing key on PR only
        if: github.ref != 'refs/heads/main'
        run: |
          php -r '$kp=sodium_crypto_sign_keypair();file_put_contents(getenv("GITHUB_ENV"),"SCHOOLPDF_RELEASE_ED25519_KEY_B64=".base64_encode(sodium_crypto_sign_secretkey($kp))."\n",FILE_APPEND|LOCK_EX);'
      - name: Validate release signer and production trust continuity
        run: |
          python3 - <<'PY'
          import os,sys
          sys.path.insert(0,'setup')
          from build_signed_update import signing_key
          public=signing_key()
          if os.getenv('GITHUB_REF')=='refs/heads/main':
              assert public.strip()==os.environ['SCHOOLPDF_BASE_PUBLIC_B64'], 'Signing key does not match already installed 1.1.3 trust anchor'
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('SCHOOLPDF_RELEASE_ED25519_PUBLIC_B64='+public.strip()+'\n')
          print('Signer validated; no private key or live secrets packaged.')
          PY
      - name: Source tests, security audit and Laravel tests
        run: |
          test "$(cat VERSION)" = '1.1.4'
          python3 -m unittest discover -s setup/tests -p 'test_*.py' -v
          find backend -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          composer validate --working-dir=backend --no-check-publish
          composer install --working-dir=backend --no-interaction --prefer-dist --no-progress
          (cd backend && vendor/bin/phpunit && composer audit --locked --no-interaction)
      - name: Build locked Composer production vendor before packaging tests
        run: |
          rm -rf backend/vendor
          composer install --working-dir=backend --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress
          test -s backend/vendor/autoload.php
      - name: Build exact source preview and test synthetic failure recovery
        run: |
          python3 setup/build_preview.py --git-sha "$GITHUB_SHA"
          SCHOOLPDF_CI_INSTALL_SMOKE=1 python3 setup/tests/smoke_preview_mysql.py
      - name: Create Setup ZIP and signed Update ZIP from exact same tested SHA
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          evidence={
            'git_sha':os.environ['GITHUB_SHA'],'passed':True,
            'release_kind':'SETUP_AND_UPDATE_CANDIDATE',
            'checks':{'laravel_tests':'PASS','security_checks':'PASS',
                      'fresh_install':'PASS','upgrade':'PASS','recovery':'PASS'},
            'scope':{'fresh_install':'EXTRACTED_PREVIEW_1.1.4_MYSQL',
                     'upgrade':'SYNTHETIC_SIGNED_1.1.4_TO_1.1.5',
                     'actual_previous_release':'AWAITING_INDEPENDENT_REAL_UPDATE_ZIP_TEST'}
          }
          Path('setup/ci-evidence.json').write_text(json.dumps(evidence,indent=2)+'\n')
          PY
          python3 setup/build_setup.py --git-sha "$GITHUB_SHA" --trusted-update-public-key "$SCHOOLPDF_RELEASE_ED25519_PUBLIC_B64"
          python3 setup/build_signed_update.py --git-sha "$GITHUB_SHA" --from-version 1.1.3 --verified-base-lock-sha "$SCHOOLPDF_BASE_LOCK_SHA"
          cd setup/output
          sha256sum -c SchoolPDF-Setup-v1.1.4.sha256
          sha256sum -c SchoolPDF-Update-v1.1.4.zip.sha256
          python3 - <<'PY'
          import base64,hashlib,json,os,zipfile
          with zipfile.ZipFile('SchoolPDF-Update-v1.1.4.zip') as z:
              assert z.testzip() is None
              raw=z.read('manifest.json')
              m=json.loads(raw)
              assert m['target_version']=='1.1.4' and m['supported_base_versions']==['1.1.3']
              assert m['git_sha']==os.environ['GITHUB_SHA']
              files=[x['path'] for x in m['files']]
              assert '.env' not in files and 'public/app-ads.txt' not in files
              assert 'resources/views/legal/data-deletion.blade.php' in files
              sig=base64.b64decode(z.read('signature.ed25519'),validate=True)
              assert len(sig)==64
          print('Signed update exact SHA, checksum, manifest and live-data exclusions verified.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SchoolPDF-v1.1.4-DELIVERY-CANDIDATE
          path: |
            setup/output/SchoolPDF-Setup-v1.1.4.zip
            setup/output/SchoolPDF-Setup-v1.1.4.sha256
            setup/output/SchoolPDF-Setup-v1.1.4-BUILD_INFO.json
            setup/output/SchoolPDF-Update-v1.1.4.zip
            setup/output/SchoolPDF-Update-v1.1.4.zip.sha256
            setup/output/SchoolPDF-Release-Public-Key.txt
          retention-days: 7
          if-no-files-found: error

  test-exact-update-from-previous-setup:
    needs: build-exact-candidates
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: isolated-ci-root-only
          MARIADB_DATABASE: schoolpdf_ci
          MARIADB_USER: schoolpdf_ci
          MARIADB_PASSWORD: isolated-ci-user-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      mariadb_restore:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: isolated-ci-root-only
          MARIADB_DATABASE: schoolpdf_restore_ci
          MARIADB_USER: schoolpdf_ci
          MARIADB_PASSWORD: isolated-ci-user-password
        ports: ['3307:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      SCHOOLPDF_TEST_DB_USERNAME: schoolpdf_ci
      SCHOOLPDF_TEST_DB_PASSWORD: isolated-ci-user-password
      SCHOOLPDF_TEST_DB_DATABASE: schoolpdf_ci
      SCHOOLPDF_TEST_RESTORE_DATABASE: schoolpdf_restore_ci
      SCHOOLPDF_TEST_RESTORE_PORT: '3307'
      SCHOOLPDF_PRODUCTION_INSTALL_SMOKE: '1'
      SCHOOLPDF_EXPECTED_SETUP_SHA: e2d1554ed88662c7ff850c4248209a70cbb5949f
      SCHOOLPDF_REAL_UPDATE_TARGET_VERSION: '1.1.4'
      SCHOOLPDF_REQUIRE_KEY_MATCH: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SchoolPDF-v1.1.4-DELIVERY-CANDIDATE
          path: setup/output
      - uses: actions/download-artifact@v4
        with:
          name: SchoolPDF-Setup-v1.1.2-VERIFIED
          run-id: 44619149023
          github-token: ${{ github.token }}
          path: previous
      - uses: actions/download-artifact@v4
        with:
          name: SchoolPDF-Update-v1.1.3-VERIFIED
          run-id: 44686475320
          github-token: ${{ github.token }}
          path: prior-update
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, fileinfo, zip, openssl, sodium
          coverage: none
      - name: Independently apply exact signed update with real production lineage
        env:
          SCHOOLPDF_SETUP_ARCHIVE: ${{ github.workspace }}/previous/SchoolPDF-Setup-v1.1.2.zip
          SCHOOLPDF_PRIOR_UPDATE_ARCHIVE: ${{ github.workspace }}/prior-update/SchoolPDF-Update-v1.1.3.zip
          SCHOOLPDF_REAL_UPDATE_ARCHIVE: ${{ github.workspace }}/setup/output/SchoolPDF-Update-v1.1.4.zip
          SCHOOLPDF_UPDATE_PUBLIC_FILE: ${{ github.workspace }}/setup/output/SchoolPDF-Release-Public-Key.txt
        run: |
          cd previous
          sha256sum -c SchoolPDF-Setup-v1.1.2.sha256
          cd ../prior-update
          sha256sum -c SchoolPDF-Update-v1.1.3.zip.sha256
          cd ../setup/output
          sha256sum -c SchoolPDF-Update-v1.1.4.zip.sha256
          cd ../..
          python3 setup/tests/smoke_preview_mysql.py
          echo "ACTUAL signed Setup 1.1.2 → signed Update 1.1.3 → signed Update 1.1.4 passed."

  test-exact-fresh-setup:
    needs: build-exact-candidates
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: isolated-ci-root-only
          MARIADB_DATABASE: schoolpdf_ci
          MARIADB_USER: schoolpdf_ci
          MARIADB_PASSWORD: isolated-ci-user-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      mariadb_restore:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: isolated-ci-root-only
          MARIADB_DATABASE: schoolpdf_restore_ci
          MARIADB_USER: schoolpdf_ci
          MARIADB_PASSWORD: isolated-ci-user-password
        ports: ['3307:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      SCHOOLPDF_TEST_DB_USERNAME: schoolpdf_ci
      SCHOOLPDF_TEST_DB_PASSWORD: isolated-ci-user-password
      SCHOOLPDF_TEST_DB_DATABASE: schoolpdf_ci
      SCHOOLPDF_TEST_RESTORE_DATABASE: schoolpdf_restore_ci
      SCHOOLPDF_TEST_RESTORE_PORT: '3307'
      SCHOOLPDF_PRODUCTION_INSTALL_SMOKE: '1'
      SCHOOLPDF_SETUP_ARCHIVE: ${{ github.workspace }}/setup/output/SchoolPDF-Setup-v1.1.4.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SchoolPDF-v1.1.4-DELIVERY-CANDIDATE
          path: setup/output
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, fileinfo, zip, openssl, sodium
          coverage: none
      - name: Independently install exact new Setup ZIP and test migration-recovery
        run: |
          cd setup/output
          sha256sum -c SchoolPDF-Setup-v1.1.4.sha256
          cd ../..
          python3 setup/tests/smoke_preview_mysql.py

  publish-verified-delivery:
    needs: [build-exact-candidates, test-exact-update-from-previous-setup, test-exact-fresh-setup]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SchoolPDF-v1.1.4-DELIVERY-CANDIDATE
          path: delivery
      - name: Verify exact tested checksums and record SHA acceptance
        run: |
          cd delivery
          sha256sum -c SchoolPDF-Setup-v1.1.4.sha256
          sha256sum -c SchoolPDF-Update-v1.1.4.zip.sha256
          python3 - <<'PY'
          import json,os,pathlib,zipfile
          sha=os.environ['GITHUB_SHA']
          with zipfile.ZipFile('SchoolPDF-Setup-v1.1.4.zip') as z:
              assert json.loads(z.read('SETUP_MANIFEST.json'))['git_sha']==sha
          with zipfile.ZipFile('SchoolPDF-Update-v1.1.4.zip') as z:
              m=json.loads(z.read('manifest.json'))
              assert m['git_sha']==sha and m['target_version']=='1.1.4'
          pathlib.Path('RELEASE_ACCEPTANCE.json').write_text(json.dumps({
              'sha':sha,'from_version':'1.1.3','to_version':'1.1.4',
              'same_commit_setup_and_update':True,'real_signed_update_on_previous_setup':'PASS',
              'fresh_setup_from_exact_zip':'PASS','preserved_env_db_uploads_app_ads':'PASS',
              'tamper_downgrade_replay':'PASS','failure_recovery':'PASS'
          },indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SchoolPDF-Update-v1.1.4-VERIFIED
          path: |
            delivery/SchoolPDF-Update-v1.1.4.zip
            delivery/SchoolPDF-Update-v1.1.4.zip.sha256
            delivery/SchoolPDF-Release-Public-Key.txt
            delivery/RELEASE_ACCEPTANCE.json
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: SchoolPDF-Setup-v1.1.4-VERIFIED
          path: |
            delivery/SchoolPDF-Setup-v1.1.4.zip
            delivery/SchoolPDF-Setup-v1.1.4.sha256
            delivery/SchoolPDF-Setup-v1.1.4-BUILD_INFO.json
            delivery/RELEASE_ACCEPTANCE.json
          retention-days: 30
          if-no-files-found: error
