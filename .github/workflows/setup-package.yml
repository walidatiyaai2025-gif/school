name: School PDF cPanel Setup v1.1.2 - Verified First Install
on:
  push:
    branches: [main, test/cpanel-db-recovery-release-gates]
    paths:
      - 'backend/**'
      - 'setup/**'
      - 'VERSION'
      - '.github/workflows/setup-package.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'setup/**'
      - 'VERSION'
      - '.github/workflows/setup-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: isolated-ci-root-only
          MARIADB_DATABASE: schoolpdf_ci
          MARIADB_USER: schoolpdf_ci
          MARIADB_PASSWORD: isolated-ci-user-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      mariadb_restore:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: isolated-ci-root-only
          MARIADB_DATABASE: schoolpdf_restore_ci
          MARIADB_USER: schoolpdf_ci
          MARIADB_PASSWORD: isolated-ci-user-password
        ports: ['3307:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      SCHOOLPDF_TEST_DB_USERNAME: schoolpdf_ci
      SCHOOLPDF_TEST_DB_PASSWORD: isolated-ci-user-password
      SCHOOLPDF_TEST_DB_DATABASE: schoolpdf_ci
      SCHOOLPDF_TEST_RESTORE_DATABASE: schoolpdf_restore_ci
      SCHOOLPDF_TEST_RESTORE_PORT: '3307'
      # The user-provisioned release secret is ONLY accessible on main.
      SCHOOLPDF_RELEASE_ED25519_KEY_B64: ${{ github.ref == 'refs/heads/main' && secrets.SCHOOLPDF_RELEASE_ED25519_KEY_B64 || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare PHP 8.3 and Composer for CI only
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: mbstring, pdo_mysql, pdo_sqlite, zip, fileinfo, openssl, sodium
          coverage: none
      - name: Create disposable CI-only signer on non-main branches
        if: github.ref != 'refs/heads/main'
        run: |
          php -r '$kp=sodium_crypto_sign_keypair(); file_put_contents(getenv("GITHUB_ENV"), "SCHOOLPDF_RELEASE_ED25519_KEY_B64=".base64_encode(sodium_crypto_sign_secretkey($kp))."\n",FILE_APPEND|LOCK_EX);'
      - name: Validate protected release signer and derive PUBLIC trust key
        run: |
          python3 - <<'PY'
          import sys, os
          sys.path.insert(0,'setup')
          from build_signed_update import signing_key
          public = signing_key()
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('SCHOOLPDF_RELEASE_ED25519_PUBLIC_B64='+public+'\n')
          print('Trusted Ed25519 signer validated; only public key derived.')
          PY
      - name: Verify locked Composer definition and complete PHP source
        run: |
          test -s backend/composer.lock
          composer validate --working-dir=backend --no-check-publish
          python3 -m unittest discover -s setup/tests -p 'test_*.py' -v
          find backend -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
      - name: Laravel functional tests and Composer security audit
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          vendor/bin/phpunit
          composer audit --locked --no-interaction
      - name: Build full Composer production vendor tree in GitHub Actions
        working-directory: backend
        run: |
          rm -rf vendor
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress
          test -s vendor/autoload.php
          test -s vendor/laravel/framework/src/Illuminate/Foundation/Application.php
      - name: Test actual preview ZIP, signed upgrade, migrations and full recovery
        run: |
          python3 setup/build_preview.py --git-sha "$GITHUB_SHA"
          SCHOOLPDF_CI_INSTALL_SMOKE=1 python3 setup/tests/smoke_preview_mysql.py
      - name: Record CI-produced exact SHA acceptance evidence
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('setup/ci-evidence.json').write_text(json.dumps({
              'git_sha':os.environ['GITHUB_SHA'],
              'passed':True,
              'release_kind':'FIRST_INSTALL_NO_PRIOR_PRODUCTION_BASE',
              'checks':{
                  'laravel_tests':'PASS',
                  'security_checks':'PASS',
                  'fresh_install':'PASS',
                  'upgrade':'PASS',
                  'recovery':'PASS'
              },
              'scope':{
                  'fresh_install':'EXTRACTED_PREVIEW_PACKAGE_MYSQL',
                  'upgrade':'CI_SYNTHETIC_SIGNED_1.1.2_TO_1.1.3',
                  'recovery':'POST_DDL_FAILURE_RESTORED_TO_SEPARATE_MARIADB',
                  'update_zip_from_prior_production':'NOT_APPLICABLE_INITIAL_RELEASE'
              }
          },indent=2)+'\n')
          print('Exact SHA test evidence written on CI runner after acceptance; not committed.')
          PY
      - name: Build first-install Setup ZIP with verified PUBLIC update signer
        run: |
          python3 setup/build_setup.py --git-sha "$GITHUB_SHA" --trusted-update-public-key "$SCHOOLPDF_RELEASE_ED25519_PUBLIC_B64"
          cd setup/output
          sha256sum -c SchoolPDF-Setup-v1.1.2.sha256
          python3 - <<'PY'
          import json, zipfile
          with zipfile.ZipFile('SchoolPDF-Setup-v1.1.2.zip') as z:
              assert z.testzip() is None
              names=set(z.namelist())
              assert 'vendor/autoload.php' in names
              assert 'SETUP_MANIFEST.json' in names
              assert 'setup-access.key' not in names
              assert '.env' not in names
              assert 'PREVIEW-NOT-FOR-PRODUCTION.txt' not in names
              manifest=json.loads(z.read('SETUP_MANIFEST.json'))
              assert manifest['kind']=='fresh-install'
              assert manifest['signed_updates'] is True
              assert manifest['git_sha']!= ''
              assert 'SCHOOLPDF_ED25519_UPDATE_PUBLIC_KEY="' in z.read('.env.example').decode()
          print('Production candidate archive integrity verified.')
          PY
      - name: Upload provisional ZIP (not approved until exact archive install succeeds)
        uses: actions/upload-artifact@v4
        with:
          name: SchoolPDF-Setup-v1.1.2-CANDIDATE-UNVERIFIED
          path: |
            setup/output/SchoolPDF-Setup-v1.1.2.zip
            setup/output/SchoolPDF-Setup-v1.1.2.sha256
            setup/output/SchoolPDF-Setup-v1.1.2-BUILD_INFO.json
          retention-days: 7
          if-no-files-found: error

  independently-install-exact-setup:
    needs: build-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: isolated-ci-root-only
          MARIADB_DATABASE: schoolpdf_ci
          MARIADB_USER: schoolpdf_ci
          MARIADB_PASSWORD: isolated-ci-user-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      mariadb_restore:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: isolated-ci-root-only
          MARIADB_DATABASE: schoolpdf_restore_ci
          MARIADB_USER: schoolpdf_ci
          MARIADB_PASSWORD: isolated-ci-user-password
        ports: ['3307:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      SCHOOLPDF_TEST_DB_USERNAME: schoolpdf_ci
      SCHOOLPDF_TEST_DB_PASSWORD: isolated-ci-user-password
      SCHOOLPDF_TEST_DB_DATABASE: schoolpdf_ci
      SCHOOLPDF_TEST_RESTORE_DATABASE: schoolpdf_restore_ci
      SCHOOLPDF_TEST_RESTORE_PORT: '3307'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SchoolPDF-Setup-v1.1.2-CANDIDATE-UNVERIFIED
          path: setup/output
      - name: Prepare PHP 8.3 without installing Composer packages
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, fileinfo, zip, openssl, sodium
          coverage: none
      - name: Independently test exact final Setup ZIP (no Composer/artisan install)
        env:
          SCHOOLPDF_CI_INSTALL_SMOKE: '1'
          SCHOOLPDF_PRODUCTION_INSTALL_SMOKE: '1'
          SCHOOLPDF_SETUP_ARCHIVE: ${{ github.workspace }}/setup/output/SchoolPDF-Setup-v1.1.2.zip
        run: |
          cd setup/output
          sha256sum -c SchoolPDF-Setup-v1.1.2.sha256
          cd ../..
          python3 setup/tests/smoke_preview_mysql.py
      - name: Record independent release artifact acceptance
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          archive=Path('setup/output/SchoolPDF-Setup-v1.1.2.zip')
          evidence={
              'source_git_sha':os.environ['GITHUB_SHA'],
              'archive_sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),
              'exact_setup_zip_fresh_install':'PASS',
              'migration_failure_isolated_recovery':'PASS',
              'ephemeral_signed_upgrade_engine':'PASS',
              'prior_production_update_package':'NOT_APPLICABLE_INITIAL_RELEASE',
              'source_tests':'PASS',
              'no_production_terminal_dependency':'PASS'
          }
          Path('setup/output/RELEASE_ACCEPTANCE.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print('Exact ZIP independently installed and tested on separate clean CI services.')
          PY
      - name: Upload exact archive acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: SchoolPDF-Setup-v1.1.2-ACCEPTANCE-EVIDENCE
          path: setup/output/RELEASE_ACCEPTANCE.json
          retention-days: 30
          if-no-files-found: error

  publish-verified-cpanel-setup:
    if: github.ref == 'refs/heads/main'
    needs: independently-install-exact-setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SchoolPDF-Setup-v1.1.2-CANDIDATE-UNVERIFIED
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: SchoolPDF-Setup-v1.1.2-ACCEPTANCE-EVIDENCE
          path: release
      - name: Cross-check immutable ZIP SHA and final commit acceptance
        run: |
          cd release
          sha256sum -c SchoolPDF-Setup-v1.1.2.sha256
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          evidence=json.loads(pathlib.Path('RELEASE_ACCEPTANCE.json').read_text())
          assert evidence['source_git_sha']==os.environ['GITHUB_SHA']
          assert evidence['exact_setup_zip_fresh_install']=='PASS'
          assert evidence['migration_failure_isolated_recovery']=='PASS'
          assert evidence['archive_sha256']==hashlib.sha256(pathlib.Path('SchoolPDF-Setup-v1.1.2.zip').read_bytes()).hexdigest()
          print('Exact commit, checksum and acceptance evidence match.')
          PY
      - name: Build verified fixed-DocumentRoot cPanel deployment packages
        run: |
          python3 setup/build_fixed_root.py \
            --archive release/SchoolPDF-Setup-v1.1.2.zip \
            --checksum release/SchoolPDF-Setup-v1.1.2.sha256 \
            --acceptance release/RELEASE_ACCEPTANCE.json \
            --output release
          cp setup/FIXED_ROOT_DEPLOY_AR.md release/SchoolPDF-FixedRoot-DEPLOY_AR.md
          cd release
          sha256sum -c SchoolPDF-WebBridge-v1.1.2.zip.sha256
          sha256sum -c SchoolPDF-FixedRoot-Setup-v1.1.2.zip.sha256
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('SchoolPDF-WebBridge-v1.1.2.zip') as z:
              assert set(z.namelist()) == {
                  '.htaccess', '.schoolpdf-bridge.php', 'index.php', 'install.php'
              }
              assert z.testzip() is None
          with zipfile.ZipFile('SchoolPDF-FixedRoot-Setup-v1.1.2.zip') as z:
              names = set(z.namelist())
              assert z.testzip() is None
              assert 'sclpdf/vendor/autoload.php' in names
              assert 'sclpdf/SETUP_MANIFEST.json' in names
              assert 'public_html/sclpdf.50sols.com/index.php' in names
              assert 'public_html/sclpdf.50sols.com/.htaccess' in names
              assert 'public_html/sclpdf.50sols.com/vendor/autoload.php' not in names
              assert 'public_html/sclpdf.50sols.com/.env' not in names
          print('Fixed-root bundles contain only public bridge entries under public_html.')
          PY
      - name: Publish School PDF cPanel Setup ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SchoolPDF-Setup-v1.1.2-VERIFIED
          path: |
            release/SchoolPDF-Setup-v1.1.2.zip
            release/SchoolPDF-Setup-v1.1.2.sha256
            release/SchoolPDF-Setup-v1.1.2-BUILD_INFO.json
            release/RELEASE_ACCEPTANCE.json
          retention-days: 30
          if-no-files-found: error
      - name: Publish verified fixed-root one-ZIP and web-only bridge
        uses: actions/upload-artifact@v4
        with:
          name: SchoolPDF-FixedRoot-v1.1.2-VERIFIED
          path: |
            release/SchoolPDF-WebBridge-v1.1.2.zip
            release/SchoolPDF-WebBridge-v1.1.2.zip.sha256
            release/SchoolPDF-FixedRoot-Setup-v1.1.2.zip
            release/SchoolPDF-FixedRoot-Setup-v1.1.2.zip.sha256
            release/SchoolPDF-FixedRoot-DEPLOY_AR.md
            release/RELEASE_ACCEPTANCE.json
          retention-days: 30
          if-no-files-found: error
