name: School PDF Landing Visual Acceptance
on:
  pull_request:
    paths:
      - 'backend/resources/views/legal/home.blade.php'
      - 'backend/public/landing/**'
      - 'backend/public/brand-icon.png'
      - 'backend/tests/Feature/LandingPageTest.php'
      - '.github/workflows/landing-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshot-and-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, fileinfo, zip, gd
          coverage: none
      - name: Install locked Laravel dependencies for CI only
        working-directory: backend
        run: |
          cp .env.example .env
          composer install --prefer-dist --no-progress --no-interaction
          php artisan key:generate --force
      - name: Landing feature tests
        working-directory: backend
        run: ./vendor/bin/phpunit --filter=LandingPageTest
      - name: Render exact HTML/CSS in Chrome at reference and mobile viewports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p landing-visual
          cat > /tmp/schoolpdf-landing-router.php <<'PHP'
          <?php
          $path = urldecode(parse_url($_SERVER['REQUEST_URI'], PHP_URL_PATH) ?: '/');
          $static = getcwd() . '/backend/public' . $path;
          if ($path !== '/' && is_file($static)) {
              return false;
          }
          require getcwd() . '/backend/public/index.php';
          PHP
          php -S 127.0.0.1:8765 -t backend/public /tmp/schoolpdf-landing-router.php > /tmp/schoolpdf-landing-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..35}; do
            if curl -fsS http://127.0.0.1:8765/ > landing-visual/rendered.html; then break; fi
            sleep 1
          done
          grep -q 'hero-brand' landing-visual/rendered.html
          grep -q 'hero-ornaments.svg' landing-visual/rendered.html
          test "$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/brand-icon.png)" = 200
          test "$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/landing/hero-ornaments.svg)" = 200
          if command -v google-chrome >/dev/null; then
            CHROME=google-chrome
          elif command -v chromium >/dev/null; then
            CHROME=chromium
          else
            echo 'Chromium-family browser unavailable'; exit 1
          fi
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --disable-dev-shm-usage --force-device-scale-factor=1 --screenshot="$PWD/landing-visual/desktop-1672x941.png" --window-size=1672,941 --virtual-time-budget=1800 http://127.0.0.1:8765/
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --disable-dev-shm-usage --force-device-scale-factor=1 --screenshot="$PWD/landing-visual/mobile-390x844.png" --window-size=390,844 --virtual-time-budget=1800 http://127.0.0.1:8765/
          python3 - <<'PY'
          from pathlib import Path
          import struct
          for fname in ('desktop-1672x941.png','mobile-390x844.png'):
              path=Path('landing-visual')/fname
              b=path.read_bytes()
              assert b[:8]==b'\x89PNG\r\n\x1a\n' and len(b)>10000, f'invalid screenshot: {fname}'
              w,h=struct.unpack('>II',b[16:24])
              assert w>=390 and h>=700, f'unexpected screenshot size: {fname}: {w}x{h}'
              print(f'{fname}: {w}x{h}, {len(b)} bytes')
          PY
      - name: Upload evidence for reference-image visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SchoolPDF-Landing-Visual-1672-and-390
          path: landing-visual/
          retention-days: 14
