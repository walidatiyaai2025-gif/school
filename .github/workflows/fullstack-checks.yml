name: School PDF Full Stack Source Checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/fullstack-checks.yml'
  push:
    paths:
      - 'mobile/**'
      - 'backend/**'
      - 'setup/**'
      - 'VERSION'
      - 'scripts/**'
      - '.github/workflows/fullstack-checks.yml'
      - '.github/workflows/setup-preview.yml'
permissions:
  contents: read
jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: PHP with required extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: mbstring, pdo_mysql, pdo_sqlite, fileinfo, zip, openssl, sodium
          coverage: none
      - name: PHP syntax
        run: find backend -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Resolve and install backend dependencies (no release until lock committed)
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Laravel Feature Tests
        working-directory: backend
        run: vendor/bin/phpunit
      - name: Release-gate note
        shell: bash
        run: |
          if [ ! -s backend/composer.lock ]; then
            echo 'Release BLOCKED: composer.lock not present in checkout.' >&2
          fi
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Verify supplied Firebase Android/iOS client configuration
        working-directory: mobile
        run: python3 tool/verify_firebase_config.py
      - name: Ensure Kotlin Gradle build uses official Maven Central fallback
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cp mobile/tool/gradle_repositories_init.gradle "$HOME/.gradle/init.d/schoolpdf-repos.gradle"
      - name: Flutter Android prepare and analysis
        working-directory: mobile
        run: |
          flutter create --project-name school_pdf --platforms android --org com.fiftysols .
          python3 tool/patch_platforms.py
          # Flutter creates a sample MyApp test on a fresh platform scaffold;
          # it is not part of this app and must not replace real tests.
          if [ -f test/widget_test.dart ] && grep -q 'MyApp' test/widget_test.dart; then rm test/widget_test.dart; fi
          flutter pub get
          dart run flutter_launcher_icons -f tool/flutter_launcher_icons_android.yaml
          flutter analyze --no-fatal-infos
          flutter test
      - name: Build debug APK with no production ads
        working-directory: mobile
        run: flutter build apk --debug --no-pub
      - name: Verify debug APK
        run: |
          test -s mobile/build/app/outputs/flutter-apk/app-debug.apk
          python3 mobile/tool/check_android_16kb.py mobile/build/app/outputs/flutter-apk/app-debug.apk
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name zipalign | sort -V | tail -n 1)"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -c -P 16 -v 4 mobile/build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SchoolPDF-v1.1.4-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
  setup-builder-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Setup packaging and installer tests
        run: python3 -m unittest discover -s setup/tests -v

  branding-store-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate Google Play and Apple App Store brand graphics
        run: |
          python3 -m pip install 'Pillow>=11,<13'
          python3 mobile/tool/generate_store_assets.py
          python3 mobile/tool/verify_branding.py --stores
      - uses: actions/upload-artifact@v4
        with:
          name: schoolpdf-store-branding
          path: mobile/store_assets/
          if-no-files-found: error
          retention-days: 30
  ios-launcher-assets:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Generate and inspect native iOS icons
        working-directory: mobile
        run: |
          flutter create --project-name school_pdf --platforms ios --org com.fiftysols .
          python3 tool/patch_platforms.py
          flutter pub get
          dart run flutter_launcher_icons -f tool/flutter_launcher_icons_ios.yaml
          python3 tool/verify_branding.py --ios
