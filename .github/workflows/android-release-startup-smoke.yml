name: School PDF Android Release Startup Smoke
on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'VERSION'
      - '.github/workflows/android-release-startup-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  release-startup-on-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Build the exact 1.1.5 release variant with a disposable CI-only key
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat ../VERSION)" = "1.1.5"
          python3 tool/verify_firebase_config.py
          mkdir -p "$HOME/.gradle/init.d"
          cp tool/gradle_repositories_init.gradle "$HOME/.gradle/init.d/schoolpdf-repos.gradle"
          flutter create --project-name school_pdf --platforms android --org com.fiftysols .
          python3 tool/patch_platforms.py
          flutter pub get
          keytool -genkeypair -noprompt -storetype PKCS12 -keyalg RSA -keysize 2048 \
            -validity 3650 -keystore "$RUNNER_TEMP/disposable-emulator-release.jks" \
            -storepass ci-emulator-only -keypass ci-emulator-only \
            -alias disposable -dname "CN=Disposable School PDF Emulator CI"
          echo "SCHOOLPDF_UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/disposable-emulator-release.jks" >> "$GITHUB_ENV"
          echo 'SCHOOLPDF_UPLOAD_STORE_PASSWORD=ci-emulator-only' >> "$GITHUB_ENV"
          echo 'SCHOOLPDF_UPLOAD_KEY_ALIAS=disposable' >> "$GITHUB_ENV"
          echo 'SCHOOLPDF_UPLOAD_KEY_PASSWORD=ci-emulator-only' >> "$GITHUB_ENV"
      - name: Compile release APK with the same ad configuration as Google Play AAB
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --no-pub \
            --build-name=1.1.5 --build-number=5 \
            --dart-define=SCHOOLPDF_PRODUCTION_ADS=true \
            --dart-define=SCHOOLPDF_TEST_ADS=false \
            --dart-define=ADMOB_ANDROID_BANNER_ID=ca-app-pub-3218037275900725/8379591348
          test -s build/app/outputs/flutter-apk/app-release.apk
          echo "Release APK is a disposable QA build, not a Google Play upload artifact."
      - name: Package installable QA release APK with checksum and provenance
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/SchoolPDF-v1.1.5-build5-QA-Release.apk
          (cd dist && sha256sum SchoolPDF-v1.1.5-build5-QA-Release.apk > SchoolPDF-v1.1.5-build5-QA-Release.apk.sha256)
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = {
              "version_name": "1.1.5",
              "version_code": 5,
              "git_sha": os.environ.get("GITHUB_SHA"),
              "android_application_id": "com.fiftysols.schoolpdf",
              "build_type": "release",
              "signing": "DISPOSABLE_CI_QA_KEY_NOT_GOOGLE_PLAY",
              "production_ads_config": True,
              "intended_use": "manual_install_and_crash_regression_testing_only",
              "warning": "Cannot update an installed Play-signed School PDF because QA signature differs. Back up local user documents before uninstalling."
          }
          Path("dist/BUILD_INFO.json").write_text(json.dumps(data, indent=2) + "\\n")
          PY
      - name: Upload School PDF 1.1.5 QA release APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: SchoolPDF-v1.1.5-build5-QA-Release-APK-TEST-ONLY
          path: mobile/dist/
          if-no-files-found: error
          retention-days: 21
      - name: Emulator cold-launch and restart safety checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            adb install -r mobile/build/app/outputs/flutter-apk/app-release.apk
            for cycle in 1 2; do
              adb shell am force-stop com.fiftysols.schoolpdf || true
              adb logcat -c
              adb shell am start -W -n com.fiftysols.schoolpdf/.MainActivity
              sleep 20
              if ! adb shell pidof com.fiftysols.schoolpdf >/dev/null; then
                adb logcat -d -v time > "schoolpdf-release-crash-cycle-${cycle}.log"
                echo "::error::Release app exited during cold-start/relaunch cycle ${cycle}"
                exit 1
              fi
              adb logcat -d -v time > "schoolpdf-release-startup-cycle-${cycle}.log"
              echo "Release app process remained alive for startup cycle ${cycle}"
            done
      - name: Keep startup diagnostics as internal QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SchoolPDF-v1.1.5-Android-Release-Startup-Logs
          path: schoolpdf-release-*.log
          if-no-files-found: ignore
          retention-days: 7
