name: school_pdf
description: School PDF - a private, offline homework document scanner for Android and iOS.
publish_to: none
version: 1.1.3+3

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.1
  image: ^4.13.1
  pdf: ^3.13.1
  printing: ^5.15.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  share_plus: ^12.0.1
  open_filex: ^5.0.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.1
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  google_mobile_ads: ^9.2.0
  intl: ^0.20.2
  path: ^1.9.1
  url_launcher: ^6.3.2
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/icon.png
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: assets/branding/icon.png
  remove_alpha_ios: true
